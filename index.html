      return str
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[đĐ]/g, 'd')
        .trim();

    const DEFAULT_SHARED_PHOTOS = [

      { url: 'https://images.unsplash.com/photo-1511632765486-a01980e01a18?w=800&auto=format&fit=crop', caption: 'Đồng hành và gắn kết cùng Chị Em Phong Trào', fit: 'cover', position: 'center' }

    const DEFAULT_GLOBAL_LETTER = `Dear [Recipient Name],

Chúc mừng ngày Quốc tế Đàn ông 19/11!
Hôm nay là ngày dành riêng cho các anh em, nên xin phép được tạm gác những deadline, những chiếc task chưa hoàn thành và cả những lần mất tích đúng lúc cần người hỗ trợ... để gửi đến bạn một lời chúc thật đặc biệt!

Chúc bạn luôn đẹp trai theo cách của riêng mình, tự tin trong mọi hành trình, học tập và làm việc thật thuận lợi. Mong rằng ví luôn đủ dày, deadline luôn biết điều, cuộc sống ít drama và mọi kế hoạch đều chạy mượt như cách bạn mong muốn.

Stay awesome, stay confident, and keep being you!

With appreciation,
CHỊ EM PHONG TRÀO.`;

    const QUIZ_QUESTIONS = [
      {
        id: 1,
        question: "Khi đối mặt với deadline bất ngờ vào cuối tuần, bạn sẽ...?",
        options: [

          { text: "Uống liền 2 ly cà phê và bật chế độ siêu tốc độ!", points: "SURVIVOR" },

      },

        question: "Trong một buổi họp hoặc làm việc nhóm, bạn thường là người...?",
        options: [
          { text: "Đưa ra các ý tưởng đột phá và định hướng chung.", points: "GOLDEN" },
          { text: "Luôn tạo không khí vui vẻ, thoải mái cho mọi người.", points: "SUNSHINE" },
          { text: "Âm thầm gánh phần việc khó nhất dự án.", points: "MVP" },
          { text: "Gắn kết các thành viên và giải quyết mọi phát sinh.", points: "CHAOS" }
        ]
      },
      {
        id: 3,
        question: "Món quà bạn mong đợi nhất trong ngày International Men's Day?",
        options: [

          { text: "Một buổi hẹn cà phê thư giãn cùng các bạn.", points: "SILENT" }
        ]
      },
      {
        id: 4,
        question: "Siêu năng lực của bạn trong mắt bạn bè là gì?",
        options: [
          { text: "Điềm tĩnh trước mọi biến cố cuộc sống.", points: "SILENT" },
          { text: "Luôn có mặt đúng lúc khi đồng đội cần giúp đỡ.", points: "MVP" },
          { text: "Tỏa ra năng lượng tích cực khiến ai cũng mỉm cười.", points: "SUNSHINE" },
          { text: "Luôn hoàn thành xuất sắc nhiệm vụ được giao.", points: "GOLDEN" }

    // Main App Component
    function App() {
      const [step, setStep] = useState(1);
      const [recipients, setRecipients] = useState(() => {
        const saved = localStorage.getItem('ga_recipients');
        return saved ? JSON.parse(saved) : INITIAL_RECIPIENTS;
      });

      const [sharedPhotos, setSharedPhotos] = useState(() => {
        const saved = localStorage.getItem('ga_shared_photos');
        return saved ? JSON.parse(saved) : DEFAULT_SHARED_PHOTOS;
      });

      const [globalLetter, setGlobalLetter] = useState(() => {
        return localStorage.getItem('ga_global_letter') || DEFAULT_GLOBAL_LETTER;
      });

      // 🎵 DÁN CHUỖI BASE64 CỦA FILE NHẠC TỪ MÁY BẠN VÀO GIỮA CẶP DẤU NHÁY ĐƠN '' Ở DƯỚI ĐÂY:
      // Ví dụ: const defaultAudioSource = 'data:audio/mp3;base64,SUQzBAAAAAAAI1TS...';
      const defaultAudioSource = '';

      const [activeRecipient, setActiveRecipient] = useState(null);
      const [nameInput, setNameInput] = useState('');
      const [duplicateMatches, setDuplicateMatches] = useState([]);
      const [errorMessage, setErrorMessage] = useState('');

      // Audio Player state & Web Audio Fallback Synth
      const [isPlaying, setIsPlaying] = useState(false);
      const audioRef = useRef(null);
      const audioCtxRef = useRef(null);
      const synthIntervalRef = useRef(null);

      // Web Audio API synth generator as foolproof fallback if media file is empty
      const playSynthMelody = () => {
        try {
          if (!audioCtxRef.current) {
            audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtxRef.current.state === 'suspended') {
            audioCtxRef.current.resume();
          }

          const notes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23];
          let noteIdx = 0;

          if (synthIntervalRef.current) clearInterval(synthIntervalRef.current);

          synthIntervalRef.current = setInterval(() => {
            if (!audioCtxRef.current || audioCtxRef.current.state !== 'running') return;
            const osc = audioCtxRef.current.createOscillator();
            const gain = audioCtxRef.current.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(notes[noteIdx % notes.length], audioCtxRef.current.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtxRef.current.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtxRef.current.currentTime + 0.8);
            osc.connect(gain);
            gain.connect(audioCtxRef.current.destination);
            osc.start();
            osc.stop(audioCtxRef.current.currentTime + 0.8);
            noteIdx++;
          }, 600);
        } catch (e) {
          console.warn("Synth fallback error:", e);
        }
      };

      const stopSynthMelody = () => {
        if (synthIntervalRef.current) {
          clearInterval(synthIntervalRef.current);
          synthIntervalRef.current = null;
        }
        if (audioCtxRef.current && audioCtxRef.current.state === 'running') {
          audioCtxRef.current.suspend();
        }
      };

      // Robust toggle music function
      const toggleMusic = () => {
        const audio = audioRef.current;
        const nextState = !isPlaying;

        if (nextState) {
          setIsPlaying(true);
          if (audio && defaultAudioSource.trim()) {
            audio.play().catch(err => {
              console.warn("Audio file play blocked, switching to Web Audio synth fallback:", err);
              playSynthMelody();
            });
          } else {
            playSynthMelody();
          }
        } else {
          setIsPlaying(false);
          if (audio) {
            audio.pause();
          }
          stopSynthMelody();
        }
      };

      // Clean up synth on unmount
      useEffect(() => {
        return () => stopSynthMelody();
      }, []);

      // Floating Icons state
      const [floatingIcons, setFloatingIcons] = useState([]);

      // Admin Modal State
      const [showAdmin, setShowAdmin] = useState(false);
      const [adminAuthed, setAdminAuthed] = useState(false);
      const [adminPasswordInput, setAdminPasswordInput] = useState('');
      const [adminPassword, setAdminPassword] = useState(() => {
        return localStorage.getItem('ga_admin_pw') || 'gentlemen2026';
      });

      // Thank you messages storage
      const [thankYouList, setThankYouList] = useState(() => {
        const saved = localStorage.getItem('ga_thank_yous');
        return saved ? JSON.parse(saved) : [];
      });

      useEffect(() => {
        localStorage.setItem('ga_recipients', JSON.stringify(recipients));
      }, [recipients]);

      useEffect(() => {
        localStorage.setItem('ga_shared_photos', JSON.stringify(sharedPhotos));
      }, [sharedPhotos]);

      useEffect(() => {
        localStorage.setItem('ga_global_letter', globalLetter);
      }, [globalLetter]);

      useEffect(() => {
        localStorage.setItem('ga_thank_yous', JSON.stringify(thankYouList));
      }, [thankYouList]);

      const trigger5CriteriaEffect = () => {
        const icons = ['🌟', '🏃', '📚', '🌐', '🤝'];
        const newFloating = [];
        for (let i = 0; i < 25; i++) {
          newFloating.push({
            id: Date.now() + i,
            icon: icons[Math.floor(Math.random() * icons.length)],
            left: Math.random() * 90 + 5,
            delay: Math.random() * 3,
            duration: 4 + Math.random() * 3
          });
        }
        setFloatingIcons(newFloating);
        
        if (window.confetti) {
          window.confetti({
            particleCount: 80,
            spread: 70,
            origin: { y: 0.8 }
          });
        }
      };

      const handleNameSubmit = (e) => {
        e.preventDefault();
        setErrorMessage('');
        setDuplicateMatches([]);

        const norm = normalizeText(nameInput);
        if (!norm) {
          setErrorMessage('Vui lòng nhập họ và tên của bạn.');
          return;
        }

        const matches = recipients.filter(r => normalizeText(r.fullName) === norm);
        if (matches.length === 0) {
          setErrorMessage('Không tìm thấy tên trong danh sách. Vui lòng kiểm tra lại!');
        } else if (matches.length === 1) {
          setActiveRecipient(matches[0]);
          setStep(2);
        } else {
          setDuplicateMatches(matches);
        }
      };

      const handleSelectDuplicate = (rec) => {
        setActiveRecipient(rec);
        setDuplicateMatches([]);
        setStep(2);
      };

      return (
        <div className="min-h-screen bg-powderBlue text-navy flex flex-col justify-between relative selection:bg-blush selection:text-deepPink">
          {/* Background Audio */}
          <audio ref={audioRef} loop src={defaultAudioSource} preload="auto" />

          {/* Floating 5-Criteria Icons Effect */}
          {floatingIcons.map((item) => (
            <div
              key={item.id}
              className="floating-icon text-2xl select-none"
              style={{
                left: `${item.left}%`,
                animationDelay: `${item.delay}s`,
                animationDuration: `${item.duration}s`
              }}
            >
              {item.icon}
            </div>
          ))}

          {/* Header Controls */}
          <header className="p-4 sm:p-6 flex justify-between items-center max-w-4xl mx-auto w-full z-10">
            <div className="flex items-center gap-2">
              <span className="w-3 h-3 rounded-full bg-deepPink animate-pulse"></span>
              <span className="font-editorial font-bold text-sm sm:text-base text-deepPink tracking-wider uppercase">
                THE GENTLEMEN'S ARCHIVE
              </span>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={toggleMusic}
                className="px-3.5 py-2 rounded-full bg-blush border border-dustyRose text-deepPink text-xs font-bold flex items-center gap-2 shadow-sm hover:bg-dustyRose/50 transition active:scale-95 cursor-pointer"
              >
                <span>{isPlaying ? '🔊 MUSIC ON' : '🔇 MUSIC OFF'}</span>
              </button>

              <button
                onClick={() => setShowAdmin(true)}
                className="px-3.5 py-2 rounded-full bg-pearl border border-dustyRose text-navy text-xs font-bold hover:bg-dustyRose/40 transition active:scale-95"
              >
                🔑 ADMIN HUB
              </button>
            </div>
          </header>

          {/* Main Flow Container */}
          <main className="flex-1 max-w-2xl mx-auto w-full px-4 py-4 sm:py-8 flex flex-col justify-center z-10">
            {step === 1 && (
              <NameInputStep
                nameInput={nameInput}
                setNameInput={setNameInput}
                handleNameSubmit={handleNameSubmit}
                errorMessage={errorMessage}
                duplicateMatches={duplicateMatches}
                handleSelectDuplicate={handleSelectDuplicate}
              />
            )}

            {step === 2 && (
              <QuizStep
                activeRecipient={activeRecipient}
                onComplete={() => setStep(3)}
              />
            )}

            {step === 3 && (
              <PersonalityResultStep
                activeRecipient={activeRecipient}
                onNext={() => setStep(4)}
              />
            )}

            {step === 4 && (
              <EnvelopeStep
                activeRecipient={activeRecipient}
                onOpen={() => setStep(5)}
              />
            )}

            {step === 5 && (
              <PersonalPhotosStep
                activeRecipient={activeRecipient}
                onNext={() => setStep(6)}
              />
            )}

            {step === 6 && (
              <SharedPhotosStep
                sharedPhotos={sharedPhotos}
                onNext={() => setStep(7)}
              />
            )}

            {step === 7 && (
              <LetterStep
                activeRecipient={activeRecipient}
                globalLetter={globalLetter}
                onNext={() => setStep(8)}
              />
            )}

            {step === 8 && (
              <SecretMessageStep
                activeRecipient={activeRecipient}
                onNext={() => setStep(9)}
              />
            )}

            {step === 9 && (
              <ThankYouStep
                activeRecipient={activeRecipient}
                thankYouList={thankYouList}
                setThankYouList={setThankYouList}
                onNext={() => setStep(10)}
              />
            )}

            {step === 10 && (
              <FinalCelebrationStep
                activeRecipient={activeRecipient}
                trigger5CriteriaEffect={trigger5CriteriaEffect}
                onRestart={() => {
                  setStep(1);
                  setNameInput('');
                  setActiveRecipient(null);
                }}
              />
            )}

            clearInterval(timer);

    // INDIVIDUAL RECIPIENT INFO, SECRET MESSAGE & PHOTO FIT MANAGEMENT
    function AdminRecipientManagement({ recipients, setRecipients }) {
      const [selectedRecId, setSelectedRecId] = useState(recipients[0]?.id || null);
      const [editingRecipient, setEditingRecipient] = useState(null);
      const [isDetailsExpanded, setIsDetailsExpanded] = useState(true);

      useEffect(() => {
        const found = recipients.find(r => r.id === selectedRecId);
        if (found) {
          setEditingRecipient(JSON.parse(JSON.stringify(found)));
        }
      }, [selectedRecId, recipients]);

      if (!editingRecipient) return null;

      const handlePhotoUpload = (index, file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const dataUrl = e.target.result;
          const updatedPhotos = [...(editingRecipient.photos || [])];
          if (!updatedPhotos[index]) {
            updatedPhotos[index] = { url: '', caption: '', fit: 'cover', position: 'center' };
          }
          updatedPhotos[index].url = dataUrl;
          setEditingRecipient({ ...editingRecipient, photos: updatedPhotos });
        };
        reader.readAsDataURL(file);
      };

      const handleCaptionChange = (index, caption) => {
        const updatedPhotos = [...(editingRecipient.photos || [])];
        if (!updatedPhotos[index]) {
          updatedPhotos[index] = { url: '', caption: '', fit: 'cover', position: 'center' };
        }
        updatedPhotos[index].caption = caption;
        setEditingRecipient({ ...editingRecipient, photos: updatedPhotos });
      };

      const handlePhotoFitChange = (index, fit) => {
        const updatedPhotos = [...(editingRecipient.photos || [])];
        if (!updatedPhotos[index]) updatedPhotos[index] = { url: '', caption: '' };
        updatedPhotos[index].fit = fit;
        setEditingRecipient({ ...editingRecipient, photos: updatedPhotos });
      };

      const handlePhotoPositionChange = (index, position) => {
        const updatedPhotos = [...(editingRecipient.photos || [])];
        if (!updatedPhotos[index]) updatedPhotos[index] = { url: '', caption: '' };
        updatedPhotos[index].position = position;
        setEditingRecipient({ ...editingRecipient, photos: updatedPhotos });
      };

      const handleRemovePhoto = (index) => {
        const updatedPhotos = [...(editingRecipient.photos || [])];
        if (updatedPhotos[index]) {
          updatedPhotos[index].url = '';
        }
        setEditingRecipient({ ...editingRecipient, photos: updatedPhotos });
      };

      const handleSaveRecipient = () => {
        const nextRecipients = recipients.map(r => r.id === editingRecipient.id ? editingRecipient : r);
        setRecipients(nextRecipients);
        alert(`Đã lưu toàn bộ thông tin, lời nhắn riêng và ảnh cá nhân cho ${editingRecipient.fullName}!`);
      };

      return (
        <div className="space-y-4">
          <div className="p-4 rounded-2xl bg-blush border border-dustyRose shadow-sm space-y-3">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
              <span className="font-editorial text-sm font-bold text-deepPink uppercase tracking-wider">

              <select
                value={selectedRecId}
                onChange={(e) => setSelectedRecId(e.target.value)}

              >
                {recipients.map(r => (
                  <option key={r.id} value={r.id}>
                    {r.fullName} ({r.group || 'GENTLEMAN'})
                  </option>
                ))}
              </select>
            </div>
          </div>

          <div className="p-4 sm:p-5 rounded-2xl bg-blush border border-dustyRose shadow-sm space-y-4">

                <button

                  onClick={() => setIsDetailsExpanded(!isDetailsExpanded)}
                  className="text-xs font-bold text-deepPink hover:opacity-80 flex items-center gap-1 bg-pearl px-2.5 py-1 rounded-lg border border-dustyRose"
                >
                  {isDetailsExpanded ? '▼ THU GỌN THÔNG TIN' : '▶ HIỂN THỊ CHI TIẾT NGƯỜI NHẬN'}
                </button>
              </div>

              <button
                onClick={handleSaveRecipient}
                className="px-4 py-2 rounded-xl bg-deepPink text-pearl text-xs font-bold shadow-md hover:bg-deepPink/90 transition"
              >
                💾 LƯU THAY ĐỔI
              </button>
            </div>

            {isDetailsExpanded && (
              <div className="space-y-4 pt-1">
                <div className="p-3.5 rounded-xl bg-pearl border border-dustyRose space-y-3">
                  <h4 className="text-xs font-bold text-deepPink uppercase">1. THÔNG TIN HIỂN THỊ HỒ SƠ</h4>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                      <label className="block text-[10px] font-bold text-navy uppercase mb-1">Họ và tên người nhận</label>
                      <input
                        type="text"
                        value={editingRecipient.fullName || ''}
                        onChange={(e) => setEditingRecipient({ ...editingRecipient, fullName: e.target.value })}
                        className="w-full p-2 rounded-lg border border-dustyRose text-xs font-semibold text-navy bg-blush/20 focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-[10px] font-bold text-navy uppercase mb-1">Lớp / Nhóm phân biệt</label>
                      <input
                        type="text"
                        value={editingRecipient.group || ''}
                        onChange={(e) => setEditingRecipient({ ...editingRecipient, group: e.target.value })}
                        className="w-full p-2 rounded-lg border border-dustyRose text-xs font-semibold text-navy bg-blush/20 focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-[10px] font-bold text-navy uppercase mb-1">Kết quả tính cách (Archetype)</label>
                      <input
                        type="text"
                        value={editingRecipient.personality || ''}
                        onChange={(e) => setEditingRecipient({ ...editingRecipient, personality: e.target.value })}
                        className="w-full p-2 rounded-lg border border-dustyRose text-xs font-semibold text-navy bg-blush/20 focus:outline-none"
                      />
                    </div>
                  </div>
                </div>

                <div className="p-3.5 rounded-xl bg-pearl border border-dustyRose space-y-2">
                  <h4 className="text-xs font-bold text-deepPink uppercase">2. LỜI NHẮN BÍ MẬT RIÊNG CHO NGƯỜI NÀY</h4>
                  <textarea
                    rows="3"
                    value={editingRecipient.secretMessage || ''}
                    onChange={(e) => setEditingRecipient({ ...editingRecipient, secretMessage: e.target.value })}
                    placeholder="Nhập lời nhắn bí mật cá nhân hóa..."
                    className="w-full p-2.5 rounded-lg border border-dustyRose text-xs text-navy font-medium bg-blush/10 focus:outline-none"
                  />
                </div>

                <div className="space-y-3">
                  <h4 className="text-xs font-bold text-deepPink uppercase">3. QUẢN LÝ & CĂN CHỈNH KHUNG HÌNH 2 ẢNH CÁ NHÂN</h4>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {[0, 1].map((idx) => {
                      const photo = (editingRecipient.photos && editingRecipient.photos[idx]) || { url: '', caption: '', fit: 'cover', position: 'center' };
                      return (
                        <div key={idx} className="p-3 rounded-xl bg-pearl border border-dustyRose space-y-2">
                          <div className="flex justify-between items-center text-[11px] font-bold text-deepPink">
                            <span>ẢNH CÁ NHÂN 0{idx + 1}</span>
                            <span className="text-[10px] text-navy font-mono">ID: {editingRecipient.id}</span>
                          </div>

                          <div className="w-full aspect-square rounded-lg overflow-hidden border border-dustyRose bg-blush/40 flex items-center justify-center relative">
                            {photo.url ? (
                              <img
                                src={photo.url}
                                alt={`Personal ${idx + 1}`}
                                className="w-full h-full"
                                style={{ objectFit: photo.fit || 'cover', objectPosition: photo.position || 'center' }}
                              />
                            ) : (
                              <div className="text-center p-2">
                                <span className="text-xl block mb-1">🖼️</span>
                                <span className="text-[10px] font-bold text-deepPink/70">Chưa có ảnh</span>
                              </div>
                            )}
                          </div>

                          <div>
                            <label className="block text-[10px] font-bold text-deepPink uppercase mb-1">Chú thích ảnh 0{idx + 1}</label>
                            <input
                              type="text"
                              placeholder="Nhập chú thích..."
                              value={photo.caption || ''}
                              onChange={(e) => handleCaptionChange(idx, e.target.value)}
                              className="w-full p-2 rounded-lg border border-dustyRose text-xs text-deepPink font-semibold bg-blush/30 focus:outline-none"
                            />
                          </div>

                          <div className="grid grid-cols-2 gap-2 text-[10px] font-bold">
                            <div>
                              <label className="block text-navy mb-1">Chế độ khung ảnh</label>
                              <select
                                value={photo.fit || 'cover'}
                                onChange={(e) => handlePhotoFitChange(idx, e.target.value)}
                                className="w-full p-1.5 rounded-md border border-dustyRose bg-blush/20 text-navy"
                              >
                                <option value="cover">Cover (Lấp đầy khung)</option>
                                <option value="contain">Contain (Trọn vẹn ảnh)</option>
                                <option value="fill">Fill (Co giãn)</option>
                              </select>
                            </div>

                            <div>
                              <label className="block text-navy mb-1">Căn vị trí ảnh</label>
                              <select
                                value={photo.position || 'center'}
                                onChange={(e) => handlePhotoPositionChange(idx, e.target.value)}
                                className="w-full p-1.5 rounded-md border border-dustyRose bg-blush/20 text-navy"
                              >
                                <option value="center">Giữa (Center)</option>
                                <option value="top">Trên (Top)</option>
                                <option value="bottom">Dưới (Bottom)</option>
                              </select>
                            </div>
                          </div>

                          <div className="flex gap-2 text-xs font-bold pt-1">
                            <label className="flex-1 py-1.5 px-2 rounded-lg bg-deepPink text-pearl text-center cursor-pointer hover:bg-deepPink/90 transition text-[11px]">
                              <span>{photo.url ? 'Thay ảnh' : 'Tải ảnh lên'}</span>
                              <input
                                type="file"
                                accept="image/*"
                                className="hidden"
                                onChange={(e) => handlePhotoUpload(idx, e.target.files[0])}
                              />
                            </label>
                            {photo.url && (
                              <button
                                onClick={() => handleRemovePhoto(idx)}
                                className="py-1.5 px-3 rounded-lg bg-rose-600 text-white text-center hover:bg-rose-700 transition text-[11px]"
                              >
                                Xóa
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

        if (!file) return;

          const updated = [...sharedPhotos];
          if (!updated[idx]) updated[idx] = { url: '', caption: '', fit: 'cover', position: 'center' };
          updated[idx].url = e.target.result;
          setSharedPhotos(updated);
        };
        reader.readAsDataURL(file);

      const handleCaptionGroup = (idx, caption) => {
        const updated = [...sharedPhotos];
        if (!updated[idx]) updated[idx] = { url: '', caption: '', fit: 'cover', position: 'center' };
        updated[idx].caption = caption;
        setSharedPhotos(updated);
      };

      const handleFitGroup = (idx, fit) => {
        const updated = [...sharedPhotos];
        if (!updated[idx]) updated[idx] = { url: '', caption: '' };
        updated[idx].fit = fit;
        setSharedPhotos(updated);
      };

        <div className="space-y-4">
          <div className="p-4 rounded-2xl bg-blush border border-dustyRose shadow-sm space-y-2">

              return (
                <div key={idx} className="p-3 rounded-xl bg-pearl border border-dustyRose space-y-3">

                        style={{ objectFit: photo.fit || 'cover', objectPosition: photo.position || 'center' }}

                    >
                      <option value="cover">Cover (Lấp đầy)</option>
                      <option value="contain">Contain (Trọn vẹn)</option>
                    </select>
                  </div>
                  <label className="block w-full py-2 px-3 rounded-lg bg-deepPink text-pearl text-center text-xs font-bold cursor-pointer hover:bg-deepPink/90 transition">
                    Tải ảnh tập thể lên
                    <input
                      type="file"
                      accept="image/*"
                      className="hidden"
                      onChange={(e) => handleUploadGroup(idx, e.target.files[0])}
                    />
                  </label>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
