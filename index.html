  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Global variables & Firebase Config initialization
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'gentlemen-archive-2026';
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "demo-api-key",
          authDomain: "demo-app.firebaseapp.com",
          projectId: "demo-app",
          storageBucket: "demo-app.appspot.com",
          messagingSenderId: "123456789",
          appId: "1:123456789:web:demo"
        };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Authenticate user & attach global Firebase utilities
    window.fbDb = db;
    window.fbAppId = appId;
    window.fbDoc = doc;
    window.fbSetDoc = setDoc;
    window.fbOnSnapshot = onSnapshot;

    async function initAuth() {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
        window.fbUser = auth.currentUser;
        window.dispatchEvent(new Event('firebase-ready'));
      } catch (e) {
        console.warn("Firebase Auth fallback/warning:", e);
        window.dispatchEvent(new Event('firebase-ready'));
      }
    }
    initAuth();
  </script>

    function LetterStep({ activeRecipient, globalLetter, onNext }) {
      const fullText = globalLetter.replace(/\[Recipient Name\]/g, activeRecipient?.fullName || 'bạn');
      const [displayedText, setDisplayedText] = useState('');
      const [isTypingComplete, setIsTypingComplete] = useState(false);

      useEffect(() => {
        let index = 0;
        setDisplayedText('');
        setIsTypingComplete(false);

        const timer = setInterval(() => {
          if (index < fullText.length) {
            setDisplayedText((prev) => prev + fullText.charAt(index));
            index++;
          } else {
            setIsTypingComplete(true);
            clearInterval(timer);
          }
        }, 20);

        return () => clearInterval(timer);
      }, [fullText]);

      const handleSkipTyping = () => {
        setDisplayedText(fullText);
        setIsTypingComplete(true);
      };

      return (
        <div className="bg-pearl p-6 sm:p-8 rounded-3xl shadow-card border border-dustyRose/40 text-left animate-fadeIn">
          <div className="text-center mb-6">
            <span className="text-xs font-bold text-deepPink bg-blush px-3 py-1 rounded-full inline-block mb-1">

              <p className="text-[11px] text-softGrey mt-1 cursor-pointer underline" onClick={handleSkipTyping}>

                            </div>
                            <button 
                              onClick={() => setSharedPhotos(sharedPhotos.filter((_, i) => i !== idx))}
                              className="px-2.5 py-1.5 bg-red-100 text-red-600 font-bold rounded-lg text-xs"
                            >
                              Xóa
                            </button>
                          </div>
                          <div className="flex gap-2 text-[10px] items-center bg-slate-50 p-1.5 rounded-lg">
                            <label className="font-semibold text-softGrey">Hiển thị:</label>
                            <select 
                              value={p.fit || 'cover'} 
                              onChange={(e) => {
                                const copy = [...sharedPhotos];
                                copy[idx].fit = e.target.value;
                                setSharedPhotos(copy);
                              }}
                              className="p-1 border rounded bg-white text-navy"
                            >
                              <option value="cover">Cắt vừa khung (Cover)</option>
                              <option value="contain">Vừa vặn (Contain)</option>
                              <option value="fill">Kéo giãn (Fill)</option>
                            </select>

                            <label className="font-semibold text-softGrey ml-1">Vị trí:</label>
                            <select 
                              value={p.position || 'center'} 
                              onChange={(e) => {
                                const copy = [...sharedPhotos];
                                copy[idx].position = e.target.value;
                                setSharedPhotos(copy);
                              }}
                              className="p-1 border rounded bg-white text-navy"
                            >
                              <option value="center">Giữa</option>
                              <option value="top">Trên</option>
                              <option value="bottom">Dưới</option>
                            </select>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {tab === 'thanks' && (
                  <div className="space-y-3 text-xs">
                    {thankYouList.length === 0 ? (
                      <p className="text-softGrey text-center py-4">Chưa có phản hồi nào.</p>
                    ) : (
                      thankYouList.map(item => (
                        <div key={item.id} className="p-3 bg-white rounded-xl border border-dustyRose">
                          <div className="flex justify-between font-bold text-deepPink mb-1">
                            <span>{item.name}</span>
                            <span className="text-[10px] text-softGrey">{item.time}</span>
                          </div>
                          <p className="text-navy">{item.message}</p>
                        </div>
                      ))
                    )}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [currentStep, setCurrentStep] = useState(1);
      const [nameInput, setNameInput] = useState('');
      const [errorMessage, setErrorMessage] = useState('');
      const [activeRecipient, setActiveRecipient] = useState(null);
      const [duplicateMatches, setDuplicateMatches] = useState([]);

      const [recipients, setRecipients] = useState(INITIAL_RECIPIENTS);
      const [sharedPhotos, setSharedPhotos] = useState(DEFAULT_SHARED_PHOTOS);
      const [globalLetter, setGlobalLetter] = useState(DEFAULT_GLOBAL_LETTER);
      const [thankYouList, setThankYouList] = useState([]);

      // Music state & default audio stream / local file fallback
      const [isPlaying, setIsPlaying] = useState(false);
      const [defaultAudioSource, setDefaultAudioSource] = useState('music.mp3');
      const audioRef = useRef(null);
      const synthRef = useRef(null);

      // Admin Modal state
      const [showAdmin, setShowAdmin] = useState(false);
      const [adminAuthed, setAdminAuthed] = useState(false);
      const [adminPassword, setAdminPassword] = useState('admin123');
      const [adminPasswordInput, setAdminPasswordInput] = useState('');

      // Firebase Realtime Syncing
      useEffect(() => {
        const handleFbReady = () => {
          if (!window.fbDb) return;
          try {
            const docRef = window.fbDoc(window.fbDb, "archives", window.fbAppId);
            window.fbOnSnapshot(docRef, (docSnap) => {
              if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.recipients) setRecipients(data.recipients);
                if (data.sharedPhotos) setSharedPhotos(data.sharedPhotos);
                if (data.globalLetter) setGlobalLetter(data.globalLetter);
                if (data.thankYouList) setThankYouList(data.thankYouList);
              }
            }, (error) => {
              console.warn("Firestore snapshot listener permission or connection warning:", error.message);
            });
          } catch (err) {
            console.warn("Firestore sync setup error:", err);
          }
        };

        window.addEventListener('firebase-ready', handleFbReady);
        if (window.fbDb) handleFbReady();
        return () => window.removeEventListener('firebase-ready', handleFbReady);
      }, []);

      // Auto save changes to Firestore when state updates
      const isInitialMount = useRef(true);
      useEffect(() => {
        if (isInitialMount.current) {
          isInitialMount.current = false;
          return;
        }
        if (!window.fbDb) return;
        try {
          const docRef = window.fbDoc(window.fbDb, "archives", window.fbAppId);
          window.fbSetDoc(docRef, {
            recipients,
            sharedPhotos,
            globalLetter,
            thankYouList,
            updatedAt: new Date().toISOString()
          }, { merge: true }).catch(err => {
            console.warn("Cloud save permission/network warning:", err.message);
          });
        } catch (err) {
          console.warn("Cloud save error:", err);
        }
      }, [recipients, sharedPhotos, globalLetter, thankYouList]);

      // Web Audio API Synthesizer fallback for reliable ambient sound
      const playSynthAmbient = () => {
        try {
          if (!synthRef.current) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const ctx = new AudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(329.63, ctx.currentTime); // E4 note
            gain.gain.setValueAtTime(0.05, ctx.currentTime);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            synthRef.current = { ctx, osc, gain };
          }
        } catch(e) {
          console.warn("Synth fallback unavailable", e);
        }
      };

      const stopSynthAmbient = () => {
        if (synthRef.current) {
          try {
            synthRef.current.osc.stop();
            synthRef.current.ctx.close();
          } catch(e){}
          synthRef.current = null;
        }
      };

      const toggleMusic = () => {
        if (!audioRef.current) return;
        
        if (isPlaying) {
          audioRef.current.pause();
          stopSynthAmbient();
          setIsPlaying(false);
        } else {
          // Play HTML5 Audio or fallback to synth ambient sound
          const playPromise = audioRef.current.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              setIsPlaying(true);
            }).catch(err => {
              console.warn("Audio playback note:", err);
              playSynthAmbient();
              setIsPlaying(true);
            });
          } else {
            setIsPlaying(true);
          }
        }
      };

      const handleNameSubmit = (e) => {
        e.preventDefault();
        setErrorMessage('');
        setDuplicateMatches([]);

        const cleanInput = normalizeText(nameInput);
        if (!cleanInput) {
          setErrorMessage('Vui lòng nhập họ và tên của bạn.');
          return;
        }

        const matches = recipients.filter(r => {
          const cleanName = normalizeText(r.fullName);
          return cleanName.includes(cleanInput) || cleanInput.includes(cleanName);
        });

        if (matches.length === 0) {
          setErrorMessage('Không tìm thấy tên của bạn trong danh sách. Vui lòng kiểm tra lại!');
        } else if (matches.length === 1) {
          setActiveRecipient(matches[0]);
          setCurrentStep(2);
        } else {
          setDuplicateMatches(matches);
        }
      };

      const handleSelectDuplicate = (rec) => {
        setActiveRecipient(rec);
        setDuplicateMatches([]);
        setCurrentStep(2);
      };

      const trigger5CriteriaEffect = () => {
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 }
          });
        }
      };

      const handleRestart = () => {
        setCurrentStep(1);
        setNameInput('');
        setActiveRecipient(null);
        setDuplicateMatches([]);
      };

      return (
        <div className="min-h-screen flex flex-col justify-between p-4 sm:p-6 relative max-w-xl mx-auto">
          {/* Header Bar */}
          <header className="flex justify-between items-center mb-6 z-40 relative">
            <button 
              onClick={() => setShowAdmin(true)}
              className="text-xs font-bold text-navy/70 hover:text-navy bg-white/70 backdrop-blur-sm px-3.5 py-2 rounded-xl border border-dustyRose/40 shadow-sm transition"
            >
              🔑 ADMIN
            </button>

            <button 
              onClick={toggleMusic}
              className={`text-xs font-bold px-3.5 py-2 rounded-xl border transition shadow-sm flex items-center gap-1.5 ${
                isPlaying 
                  ? 'bg-deepPink text-white border-deepPink' 
                  : 'bg-white/70 text-navy border-dustyRose/40'
              }`}
            >
              {isPlaying ? '🔊 MUSIC ON' : '🔇 MUSIC OFF'}
            </button>

            {/* Hidden HTML5 Audio element */}
            <audio 
              ref={audioRef} 
              src={defaultAudioSource} 
              loop 
              preload="auto"
            />
          </header>

          {/* Step Render Area */}
          <main className="flex-1 flex flex-col justify-center my-auto">
            {currentStep === 1 && (
              <NameInputStep
                nameInput={nameInput}
                setNameInput={setNameInput}
                handleNameSubmit={handleNameSubmit}
                errorMessage={errorMessage}
                duplicateMatches={duplicateMatches}
                handleSelectDuplicate={handleSelectDuplicate}
              />
            )}

            {currentStep === 2 && (
              <QuizStep
                activeRecipient={activeRecipient}
                onComplete={() => setCurrentStep(3)}
              />
            )}

            {currentStep === 3 && (
              <PersonalityResultStep
                activeRecipient={activeRecipient}
                onNext={() => setCurrentStep(4)}
              />
            )}

            {currentStep === 4 && (
              <EnvelopeStep
                activeRecipient={activeRecipient}
                onOpen={() => setCurrentStep(5)}
              />
            )}

            {currentStep === 5 && (
              <PersonalPhotosStep
                activeRecipient={activeRecipient}
                onNext={() => setCurrentStep(6)}
              />
            )}

            {currentStep === 6 && (
              <SharedPhotosStep
                sharedPhotos={sharedPhotos}
                onNext={() => setCurrentStep(7)}
              />
            )}

            {currentStep === 7 && (
              <LetterStep
                activeRecipient={activeRecipient}
                globalLetter={globalLetter}
                onNext={() => setCurrentStep(8)}
              />
            )}

            {currentStep === 8 && (
              <SecretMessageStep
                activeRecipient={activeRecipient}
                onNext={() => setCurrentStep(9)}
              />
            )}

            {currentStep === 9 && (
              <ThankYouStep
                activeRecipient={activeRecipient}
                thankYouList={thankYouList}
                setThankYouList={setThankYouList}
                onNext={() => setCurrentStep(10)}
              />
            )}

            {currentStep === 10 && (
              <FinalCelebrationStep
                activeRecipient={activeRecipient}
                trigger5CriteriaEffect={trigger5CriteriaEffect}
                onRestart={handleRestart}
              />
            )}
          </main>

          {/* Footer */}
          <footer className="mt-8 text-center text-[11px] text-softGrey/80 font-medium tracking-wide">
            INTERNATIONAL MEN'S DAY 2026 • CREATED WITH ❤️ BY CHỊ EM PHONG TRÀO
          </footer>

          {/* Admin Dashboard Modal */}
          {showAdmin && (
            <AdminModal
              adminAuthed={adminAuthed}
              setAdminAuthed={setAdminAuthed}
              adminPasswordInput={adminPasswordInput}
              setAdminPasswordInput={setAdminPasswordInput}
              adminPassword={adminPassword}
              setAdminPassword={setAdminPassword}
              onClose={() => setShowAdmin(false)}
              recipients={recipients}
              setRecipients={setRecipients}
              sharedPhotos={sharedPhotos}
              setSharedPhotos={setSharedPhotos}
              globalLetter={globalLetter}
              setGlobalLetter={setGlobalLetter}
              thankYouList={thankYouList}
              setThankYouList={setThankYouList}
            />
          )}
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
